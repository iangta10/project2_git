<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Controle semanal de séries por grupamento muscular.">
  <title>Volume Semanal</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">TREINO</div>
        <h1 id="pageTitle">Volume Semanal</h1>
      </div>
      <button id="addWorkoutTop" class="icon-btn primary" aria-label="Registrar treino">＋</button>
    </header>

    <main id="content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button data-route="week" class="nav-item active"><span>◫</span><small>Semana</small></button>
      <button data-route="records" class="nav-item"><span>✓</span><small>Registros</small></button>
      <button data-route="history" class="nav-item"><span>↶</span><small>Histórico</small></button>
      <button data-route="settings" class="nav-item"><span>⚙</span><small>Ajustes</small></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status"></div>

  <script src="./app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js", { scope: "./" }).catch(function(){});
      });
    }
  </script>
</body>
</html>
