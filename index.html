<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f58725" />
  <meta name="description" content="Lista de compras pessoal, offline e instalável." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Minha Compra</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <span class="eyebrow">LISTA DE MERCADO</span>
        <h1>Minha Compra</h1>
      </div>
      <button id="themeQuick" class="icon-btn" aria-label="Alternar tema">◐</button>
    </header>

    <main id="view" class="view"></main>

    <button id="fab" class="fab" aria-label="Adicionar item">＋</button>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button data-tab="compra" class="nav-item active"><span>🛒</span><small>Compra</small></button>
      <button data-tab="frequentes" class="nav-item"><span>⭐</span><small>Frequentes</small></button>
      <button data-tab="historico" class="nav-item"><span>🧾</span><small>Histórico</small></button>
      <button data-tab="ajustes" class="nav-item"><span>⚙️</span><small>Ajustes</small></button>
    </nav>
  </div>

  <dialog id="itemDialog" class="dialog">
    <form id="itemForm" method="dialog" class="dialog-card">
      <div class="dialog-head">
        <h2 id="itemDialogTitle">Adicionar item</h2>
        <button type="button" class="icon-btn" data-close="itemDialog">✕</button>
      </div>
      <input type="hidden" id="itemId" />
      <label>Produto
        <input id="itemName" list="productSuggestions" autocomplete="off" required placeholder="Ex.: Arroz" />
        <datalist id="productSuggestions"></datalist>
      </label>
      <div class="grid2">
        <label>Quantidade<input id="itemQty" type="number" min="0" step="0.01" value="1" /></label>
        <label>Unidade
          <select id="itemUnit">
            <option>un</option><option>kg</option><option>g</option><option>L</option><option>ml</option><option>pacote</option><option>caixa</option><option>frasco</option><option>lata</option>
          </select>
        </label>
      </div>
      <div class="grid2">
        <label>Categoria<select id="itemCategory"></select></label>
        <label>Preço unitário (R$)<input id="itemPrice" inputmode="decimal" placeholder="0,00" /></label>
      </div>
      <label>Observação<input id="itemNote" placeholder="Opcional" /></label>
      <label class="checkline"><input id="itemFavorite" type="checkbox" /> Marcar como favorito</label>
      <div class="dialog-actions">
        <button type="button" class="btn secondary" data-close="itemDialog">Cancelar</button>
        <button class="btn primary" value="default">Salvar</button>
      </div>
    </form>
  </dialog>

  <dialog id="marketDialog" class="dialog">
    <form id="marketForm" method="dialog" class="dialog-card">
      <div class="dialog-head"><h2>Mercado</h2><button type="button" class="icon-btn" data-close="marketDialog">✕</button></div>
      <label>Mercado atual<select id="marketSelect"></select></label>
      <label>Novo mercado<input id="newMarketName" placeholder="Ex.: Pague Menos" /></label>
      <div class="dialog-actions"><button type="button" class="btn secondary" data-close="marketDialog">Fechar</button><button class="btn primary">Salvar</button></div>
    </form>
  </dialog>

  <dialog id="confirmDialog" class="dialog">
    <form method="dialog" class="dialog-card">
      <h2 id="confirmTitle">Confirmar</h2>
      <p id="confirmText"></p>
      <div class="dialog-actions"><button value="cancel" class="btn secondary">Cancelar</button><button id="confirmOk" value="ok" class="btn danger">Confirmar</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
